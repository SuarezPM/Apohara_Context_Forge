# Release workflow for the main `apohara-context-forge` package.
#
# Triggers on tags of the form `context-forge-v*` (e.g.
# `context-forge-v6.2.0`). Builds the wheel + sdist from the repo root,
# validates with twine, smoke-tests the SLIM install contract in a clean
# venv (import without torch/vllm), and publishes to PyPI via OIDC
# trusted publishing (no API token required).
#
# This is the sibling of `release-plugin.yml` (which ships the thin
# `apohara-vllm-plugin` shim). Publish ORDER matters: the shim depends on
# `apohara-context-forge`, so this package must reach PyPI first.
#
# ── ONE-TIME SETUP (mirrors pypi/apohara-vllm-plugin/PUBLISH.md) ──────────
# On PyPI AND TestPyPI → project settings → Publishing → Add trusted
# publisher → GitHub Actions:
#   Owner:        SuarezPM
#   Repository:   Apohara_Context_Forge
#   Workflow:     release.yml          # <- this file's name, NOT release-plugin.yml
#   Environment:  pypi                  # (and `testpypi` for the TestPyPI publisher)
# No secrets needed — the publish steps use OIDC.
# ─────────────────────────────────────────────────────────────────────────

name: release

on:
  push:
    tags:
      - "context-forge-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (OIDC)

jobs:
  # --------------------------------------------------------------------- #
  # Build the wheel + sdist on a fresh ubuntu runner and validate.        #
  # --------------------------------------------------------------------- #
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build --wheel --sdist

      - name: twine check
        run: twine check dist/*

      - name: Smoke-test the SLIM install contract in a clean venv
        run: |
          python -m venv /tmp/smoke
          source /tmp/smoke/bin/activate
          pip install dist/apohara_context_forge-*.whl
          python -c "
          import importlib.util
          import apohara_context_forge as f
          from apohara_context_forge import (
              JCRSafetyGate, JCRDecision, JUDGE_ROLES, DEFAULT_JCR_THRESHOLD,
          )
          assert importlib.util.find_spec('torch') is None, 'slim must not pull torch'
          assert importlib.util.find_spec('vllm') is None, 'slim must not pull vllm'
          print('OK: slim import works, safety kernel present, no torch/vllm:', f.__version__)
          "

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: apohara-context-forge-dist
          path: dist/*

  # --------------------------------------------------------------------- #
  # Publish to TestPyPI on any successful build of a context-forge-v* tag, #
  # OR when the workflow is dispatched manually with target=testpypi.     #
  # --------------------------------------------------------------------- #
  testpypi:
    name: publish → TestPyPI
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/context-forge-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/apohara-context-forge/
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: apohara-context-forge-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # --------------------------------------------------------------------- #
  # Publish to PyPI proper. Gated on the testpypi job to keep the         #
  # release pipeline staged. Manual dispatch with target=pypi skips the   #
  # testpypi step (for hotfixes that have already been validated).        #
  # --------------------------------------------------------------------- #
  pypi:
    name: publish → PyPI
    needs: [build, testpypi]
    if: |
      startsWith(github.ref, 'refs/tags/context-forge-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/apohara-context-forge/
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: apohara-context-forge-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
