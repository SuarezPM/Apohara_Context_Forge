[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apohara-context-forge"
version = "6.2.0"
description = "APOHARA: Context Forge — Silicon-native KV cache coordination for multi-agent LLM pipelines on AMD Instinct MI300X. Now ships with a slim safety-only install path."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Apache-2.0"}
authors = [
  { name = "Pablo M. Suarez", email = "suarezpm@csnat.unt.edu.ar" },
]
maintainers = [
  { name = "Pablo M. Suarez", email = "suarezpm@csnat.unt.edu.ar" },
]
keywords = [
  "llm", "kv-cache", "multi-agent", "context-compression",
  "amd", "rocm", "mi300x", "vllm", "safety", "inv-15", "jcr",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
# Slim deps — the safety kernel + minimal API surface.
# Heavy deps (torch, vllm, faiss, sentence-transformers, gradio, plotly,
# llmlingua) moved to the [serve] extra per the apohara-probanza Phase 3 PR.
# Consumers that only need the INV-15 safety gate (JCR + Z3 certifier)
# install slim via: pip install apohara-context-forge
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<0.28",
  "aiofiles>=24.1,<25",
  "rich>=13.9,<14",
  "psutil>=5.9,<8",
  "prometheus-client>=0.21,<1",
  "numpy>=1.26,<2.2",
  "z3-solver>=4.12",
]

[project.optional-dependencies]
# Heavy deps for the full serving stack (vllm, gradio demo, embeddings).
# Install: pip install apohara-context-forge[serve]
serve = [
  "torch>=2.5,<3",
  "vllm>=0.10,<0.20",
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3.3,<4",
  "gradio>=5.7,<6",
  "plotly>=5.24,<6",
  "llmlingua>=0.2.2,<0.3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "fastapi",
  "httpx",
  "gradio",
  "streamlit",
  "anyio",
  "pytest-anyio",
]
# verify = existing (Z3 for safety certifier; now in main deps)
verify = [
  "z3-solver>=4.12",
]
# apohara2 = optional extra for the Apohara 2.0 RAG + compression stack.
# Captured 2026-06-11 per .omc/plans/apohara-2-0.md Step 0.1.
# NOTE on `turbovec`: the Python wrapper is a placeholder until the
# `turboquant-turing` Rust crate (Phase 4) ships a maturin-built wheel to
# PyPI. The retrieval/ module's TurbovecStore class is a NotImplementedError
# stub (US-002 placeholder; real impl in US-004). Installing this extra on
# a host without `turbovec` on PyPI will log a resolution failure for that
# one dependency and the install will fail; the other deps install cleanly.
# Per the US-002 brief: "the turbovec_store.py placeholder is what runs in
# tests", so a failed turbovec resolution is the expected pre-Phase-4 state.
apohara2 = [
  "turbovec>=0.1",  # placeholder; not on PyPI yet. Real impl ships in US-004.
  "sentence-transformers>=3.3,<4",  # granite-embedding-311m-multilingual-r2 host
  "llmlingua>=0.2.2,<0.3",          # already in [serve]; repeated for clarity
]

# Toolchain note (per R11 mitigation in apohara-2-0.md):
#   cargo 1.96.0 + maturin 1.13.3 are CLI tools required to build the
#   in-tree `turboquant-turing` Rust crate (Phase 4). They are intentionally
#   NOT listed in [build-system].requires (the project still builds with
#   setuptools.build_meta for the slim install path) and NOT listed under
#   [project.optional-dependencies] (they are build-time, not runtime).
#   The captured versions live at
#   docs/research/reconcile/apohara2-toolchain.md.

[project.urls]
Homepage      = "https://github.com/SuarezPM/Apohara_Context_Forge"
Repository    = "https://github.com/SuarezPM/Apohara_Context_Forge"
Documentation = "https://github.com/SuarezPM/Apohara_Context_Forge#readme"
Changelog     = "https://github.com/SuarezPM/Apohara_Context_Forge/blob/main/CHANGELOG.md"
Audit         = "https://github.com/SuarezPM/Apohara_Context_Forge/blob/main/AUDIT.md"
Paper         = "https://doi.org/10.5281/zenodo.20412807"
Issues        = "https://github.com/SuarezPM/Apohara_Context_Forge/issues"

[tool.setuptools.packages.find]
include = ["apohara_context_forge*", "agents*", "demo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: real-model smoke tests (downloads weights on first run); requires [serve] extra",
  "heavy: tests that require [serve] extra (torch, vllm, etc.)",
  "legacy: back-compat tests for the pre-US-012 384-d path (kept green as smoke)",
]
