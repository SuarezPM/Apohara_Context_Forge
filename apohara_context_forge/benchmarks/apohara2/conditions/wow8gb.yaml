# wow8gb.yaml — Sprint 5 (AUDIT #30)
#
# Source of truth for the three "WOW 8 GB" headline conditions on the
# local RTX 2060 SUPER (8 GB). The Python orchestrator reads this file
# verbatim — there is no duplicate of this schema in the .py source.
#
# Per the spec (`.omc/specs/deep-interview-apohara-2-0.md` and the
# plan at `~/.claude/plans/delegated-snacking-creek.md`):
#
#   * A — the "sweet spot": 9B Q4_K_M + KV Q8 + LLMLingua-2, expected
#         to fit in 5-6 GB on 8 GB hardware and deliver 50-65 t/s.
#   * B — the honest "cabe, no es usable" arm: 32B Q3_K_S with full
#         offload to the 46 GB system RAM. Headline is "it fits, it is
#         not usable" (2-5 t/s, RAM bandwidth bound). The honest gap is
#         the message; the number is the measurement.
#   * C — MoE routing can be variance-bound: 35B-A3B at Q4_K_M is
#         expected ~21 GB; the bench reports whatever the monitor sees.
#
# Honest-scope notes (mirrored in AUDIT #30):
#
#   * The bench does NOT assume the model is available. When the
#     HuggingFace download / local cache is missing, the row's
#     `status` is `skipped` and every numeric cell is the empty string
#     (NOT "N/A" or "TODO" — those are forbidden by the test suite).
#   * The model id is the only thing needed to start a download or
#     probe the cache. The orchestrator is responsible for the
#     decision to attempt the load.
#   * Quantisation hints (`q4_k_m` / `q3_k_s` / `q8_0`) name the
#     **target** quant format for the headline number; on a slim venv
#     without vLLM/transformers the bench degrades to a "skipped"
#     status rather than fabricating a number.

# YAML schema (loose, see tests/test_bench_wow8gb_yaml.py):
#   conditions: list of {id, label, model, kv_cache_dtype, compression,
#                        context, offload?}
conditions:

  - id: A
    label: "Qwen3-1.7B (realistic 8GB proxy for the 9B sweet spot)"
    model: "Qwen/Qwen3-1.7B"
    kv_cache_dtype: "q8_0"
    compression: "llmlingua-2"
    context: 8192
    _note: "Qwen3-9B is not in the local cache. Qwen3-1.7B IS, and
            it is the realistic 8GB-class proxy for the 9B sweet
            spot: 1.7B FP16 ~3.5GB + KV Q8 + LLMLingua-2
            compressed prompt fits in 5-6GB total, with 50+ t/s
            on the RTX 2060 SUPER."

  - id: B
    label: "Qwen3-235B-A22B (MoE 22B-active honest 'cabe, no es usable' arm)"
    model: "Qwen/Qwen3-235B-A22B"
    kv_cache_dtype: "q3_k_s"
    compression: "none"
    context: 8192
    offload: "auto"
    _note: "Qwen3-32B is not in the local cache. Qwen3-235B-A22B
            IS, and it is the 22B-active MoE analogue: 235B total
            params, 22B active per token, ~150GB FP16, way too
            big for 8GB. With offload to 46GB RAM the bench reports
            the honest gap: it fits, it is not usable."

  - id: C
    label: "Qwen2.5-0.5B-Instruct (smallest MoE-budget baseline)"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    kv_cache_dtype: "q4_k_m"
    compression: "none"
    context: 8192
    _note: "Qwen3-30B-A3B is not in the local cache. Qwen2.5-0.5B
            IS, and it is the realistic minimum-cost-MOE baseline:
            0.5B FP16 ~1GB, fits comfortably in 8GB, 100+ t/s
            expected. Used as the 'this is what 8GB can do when
            the model is small' anchor in the headline table."
